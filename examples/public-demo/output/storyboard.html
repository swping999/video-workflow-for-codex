<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>为什么做视频时，字幕和旁白总是越到后面越对不上？ Storyboard Editor</title><style>*{box-sizing:border-box}body{margin:0;background:#eee8dd;color:#181818;font:15px/1.45 system-ui}.app{display:grid;grid-template-columns:280px minmax(420px,1fr) minmax(340px,.8fr);height:100vh}.list,.controls{overflow:auto;padding:20px;border-right:1px solid #cabfae;background:#faf7f1}.controls{border-right:0;border-left:1px solid #cabfae}.preview{display:grid;place-items:center;padding:30px;background:radial-gradient(circle,#fff 0,#e8e0d3 70%)}button,input,select,textarea{font:inherit}.scene-button{display:block;width:100%;margin:0 0 10px;padding:14px;border:1px solid #27221d;border-radius:12px;background:#fff;text-align:left}.scene-button.active{background:#202020;color:#fff}.canvas{width:min(90%,860px);aspect-ratio:16/9;padding:6%;border:3px solid #181818;border-radius:24px;background:#fffdf8;box-shadow:12px 14px 0 #c8bda9}.canvas h2{margin:0 0 24px;font-size:clamp(28px,4vw,58px)}.symbol{display:grid;place-items:center;height:48%;border-radius:20px;background:linear-gradient(135deg,#f68b36,#3159c9);color:#fff;font-size:90px}.narration{margin-top:20px;padding:12px 16px;border-radius:12px;background:#181818;color:#fff}.field{display:block;margin:0 0 16px}.field span{display:block;margin-bottom:6px;font-weight:800}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #aaa;border-radius:9px;background:#fff}.field textarea{min-height:260px;font-family:ui-monospace,monospace}.save{width:100%;padding:13px;border:0;border-radius:999px;background:#ef812c;color:#fff;font-weight:900}.hint{color:#6d655a;font-size:13px}@media(max-width:980px){.app{grid-template-columns:220px 1fr}.controls{position:fixed;right:0;top:0;bottom:0;width:360px;box-shadow:-10px 0 35px #0002}.preview{padding-right:380px}}</style><div class="app"><aside class="list"><h1>Storyboard</h1><p>explainer · editorial</p><div id="list"></div></aside><main class="preview"><div class="canvas"><h2 id="preview-title"></h2><div class="symbol" id="preview-symbol">✦</div><div class="narration" id="preview-narration"></div></div></main><aside class="controls"><h2>Visual parameters</h2><label class="field"><span>Title</span><input id="title"></label><label class="field"><span>Scene type</span><select id="layout"><option value="hero">hero</option><option value="summary">summary</option><option value="definition">definition</option><option value="mechanism">mechanism</option><option value="cause-effect">cause-effect</option><option value="timeline">timeline</option><option value="structure">structure</option><option value="analogy">analogy</option><option value="misconception">misconception</option><option value="cycle">cycle</option><option value="list-overview">list-overview</option><option value="list-item">list-item</option><option value="ranking">ranking</option><option value="recommendation">recommendation</option><option value="process">process</option><option value="decision">decision</option><option value="checkpoint">checkpoint</option><option value="demo">demo</option><option value="acceptance">acceptance</option><option value="comparison-table">comparison-table</option><option value="before-after">before-after</option><option value="tradeoff">tradeoff</option><option value="radar">radar</option><option value="decision-tree">decision-tree</option><option value="pain">pain</option><option value="solution">solution</option><option value="feature-demo">feature-demo</option><option value="proof">proof</option><option value="cta">cta</option><option value="bar-chart">bar-chart</option><option value="line-chart">line-chart</option><option value="area-chart">area-chart</option><option value="ranking-chart">ranking-chart</option><option value="trend-illustration">trend-illustration</option></select></label><label class="field"><span>Caption position</span><select id="caption"><option>bottom</option><option>top</option><option>left</option><option>right</option></select></label><label class="field"><span>Visual model JSON</span><textarea id="visual"></textarea></label><button class="save" id="save">Download storyboard.patch.json</button><p class="hint">Apply with: video-workflow apply-storyboard --project … --patch storyboard.patch.json. Only edited scenes are invalidated and re-rendered.</p></aside></div><script>const scenes=[{"sceneId":"scene-01","title":"为什么做视频时，字幕和旁白总是越到后面越对不上","layout":"hero","captionPosition":"bottom","visual":{"kind":"hero","points":["同一份逐字稿","真实音频时长","交付前校验"]},"narration":"为什么做视频时，字幕和旁白总是越到后面越对不上？","duration":3.650333},{"sceneId":"scene-02","title":"问题通常不是字幕软件，而是文案、配音和时间线各自维护了一份内容","layout":"cause-effect","captionPosition":"bottom","visual":{"kind":"cause-effect","nodes":[{"id":"copy","label":"三份内容各自修改"},{"id":"drift","label":"字幕逐渐错位"}],"relation":"导致"},"narration":"问题通常不是字幕软件，而是文案、配音和时间线各自维护了一份内容。","duration":5.519521},{"sceneId":"scene-03","title":"把逐字稿锁定，让配音和字幕读取同一组句子，再按真实音频时长安排动画，整个流程才不会越改越乱","layout":"summary","captionPosition":"bottom","visual":{"kind":"summary","points":["锁定文案","测量音频","验证字幕"]},"narration":"把逐字稿锁定，让配音和字幕读取同一组句子，再按真实音频时长安排动画，整个流程才不会越改越乱。","duration":7.744188}];let selected=0;const edits=new Map;const byId=id=>document.getElementById(id);function current(){return edits.get(scenes[selected].sceneId)||structuredClone(scenes[selected])}function store(){const base=current();base.title=byId('title').value;base.layout=byId('layout').value;base.captionPosition=byId('caption').value;try{base.visual=JSON.parse(byId('visual').value);byId('visual').style.borderColor='#aaa'}catch{byId('visual').style.borderColor='#d00';return false}edits.set(base.sceneId,base);return true}function render(){const item=current();byId('title').value=item.title;byId('layout').value=item.layout;byId('caption').value=item.captionPosition;byId('visual').value=JSON.stringify(item.visual,null,2);byId('preview-title').textContent=item.title;byId('preview-symbol').textContent=item.visual.symbol||item.visual.icon||({cycle:'↻',timeline:'◷','bar-chart':'↗',process:'→'}[item.layout]||'✦');byId('preview-narration').textContent=item.narration;document.querySelectorAll('.scene-button').forEach((el,i)=>el.classList.toggle('active',i===selected))}byId('list').innerHTML=scenes.map((scene,i)=>'<button class="scene-button" data-i="'+i+'"><b>'+String(i+1).padStart(2,'0')+' · '+scene.title.replace(/[<>&]/g,'')+'</b><br><small>'+scene.layout+' · '+scene.duration.toFixed(2)+'s</small></button>').join('');document.querySelectorAll('.scene-button').forEach(el=>el.onclick=()=>{store();selected=Number(el.dataset.i);render()});['title','layout','caption','visual'].forEach(id=>byId(id).addEventListener('input',()=>{if(store())render()}));byId('save').onclick=()=>{if(!store())return;const patch={schemaVersion:1,project:'caption-sync',scenes:[...edits.values()].map(({sceneId,title,layout,captionPosition,visual})=>({sceneId,title,layout,captionPosition,visual}))};const blob=new Blob([JSON.stringify(patch,null,2)+'\n'],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='storyboard.patch.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};render();</script></html>
