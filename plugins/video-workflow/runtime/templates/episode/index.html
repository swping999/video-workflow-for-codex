    <script>
      var STORY=window.VIDEO_WORKFLOW_STORY;var root=document.getElementById('root');
      root.style.width=STORY.render.width+'px';root.style.height=STORY.render.height+'px';document.documentElement.style.width=STORY.render.width+'px';document.documentElement.style.height=STORY.render.height+'px';document.body.style.width=STORY.render.width+'px';document.body.style.height=STORY.render.height+'px';document.documentElement.lang=STORY.copy.language||'en';root.style.setProperty('--body',STORY.visual.languageFontFamily||'sans-serif');root.style.setProperty('--display',STORY.visual.typography&&STORY.visual.typography.display||STORY.visual.languageFontFamily||'sans-serif');var brand=STORY.visual.brand||{},brandColors=brand.colors||[];if(brandColors[0])root.style.setProperty('--accent',brandColors[0]);if(brandColors[1])root.style.setProperty('--accent2',brandColors[1]);if(brand.fonts&&brand.fonts[0]){root.style.setProperty('--display',brand.fonts[0]);root.style.setProperty('--body',brand.fonts[0])}var safe=STORY.render.platform&&STORY.render.platform.safeArea||{};root.style.setProperty('--safe-top',(safe.top||.06)*100+'%');root.style.setProperty('--safe-right',(safe.right||.06)*100+'%');root.style.setProperty('--safe-bottom',(safe.bottom||.08)*100+'%');root.style.setProperty('--safe-left',(safe.left||.06)*100+'%');root.classList.add('theme-'+STORY.project.theme,STORY.project.format);
      function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
      function brandMark(){if(!brand.name&&!brand.logo)return '';return '<div class="brand headline">'+(brand.logo?'<img src="'+esc(brand.logo)+'" alt="">':'')+(brand.name?'<span>'+esc(brand.name)+'</span>':'')+'</div>'}
      function arr(v){return Array.isArray(v)?v.filter(function(x){return x!==null&&x!==undefined&&x!==''}):[]}
      function model(scene){return scene.visual&&scene.visual.model||{kind:scene.layout}}
      function labels(scene){var m=model(scene);return arr(m.points).length?arr(m.points):arr(m.nodes).map(function(n){return n.label} ).filter(Boolean).length?arr(m.nodes).map(function(n){return n.label}):[scene.title]}
      function firstAsset(value){if(!value)return null;if(typeof value==='object'){if(value.asset)return value.asset;if(value.image)return value.image;if(value.video)return value.video;if(value.screenshot)return value.screenshot;var keys=Object.keys(value);for(var i=0;i<keys.length;i++){var found=firstAsset(value[keys[i]]);if(found)return found}}return null}
      function media(asset,label){if(!asset)return '';var ext=asset.split('?')[0].split('.').pop().toLowerCase();var element=['mp4','mov','webm','m4v'].includes(ext)?'<video muted playsinline preload="auto" src="'+esc(asset)+'"></video>':'<img src="'+esc(asset)+'" alt="'+esc(label||'Scene visual')+'">';return '<div class="asset-slot timed media-check">'+element+'<span class="asset-label">VISUAL</span></div>'}
      function wrap(scene,content){var asset=scene.visual&&scene.visual.asset||firstAsset(model(scene));return '<div class="visual-grid '+(asset?'':'no-asset')+'"><div class="visual-content">'+content+'</div>'+media(asset,scene.title)+'</div>'}
      function hero(scene,index){return wrap(scene,'<div class="hero"><div class="hero-mark timed">'+String(index+1).padStart(2,'0')+'</div><div class="panel hero-copy">'+labels(scene).slice(0,4).map(function(text,i){return i?'<div class="chip timed" data-fit>'+esc(text)+'</div>':'<strong class="timed" data-fit>'+esc(text)+'</strong>'}).join('')+'</div></div>')}
      function summary(scene){return wrap(scene,'<div class="summary">'+labels(scene).slice(0,7).map(function(text){return '<div class="tag timed" data-fit>'+esc(text)+'</div>'}).join('')+'</div>')}

      function listItem(scene){var m=model(scene),overview=arr(m.items);if(overview.length)return wrap(scene,'<div class="list-grid">'+overview.slice(0,6).map(function(item,i){return '<div class="list-mini timed"><span>'+esc(item.rank||i+1)+'</span><strong data-fit>'+esc(item.name||item.title||item)+'</strong>'+(item.reason?'<small>'+esc(item.reason)+'</small>':'')+'</div>'}).join('')+'</div>');var item=m.item||{},pros=arr(item.pros),cons=arr(item.cons);return wrap(scene,'<div class="panel list-card"><div class="rank timed">'+esc(item.rank||'•')+'</div><div class="list-main"><h2 class="timed" data-fit>'+esc(item.name||scene.title)+'</h2>'+(item.reason?'<p class="timed" data-fit>'+esc(item.reason)+'</p>':'')+(item.audience?'<p class="timed" data-fit>适用：'+esc(item.audience)+'</p>':'')+'</div><div class="list-meta">'+pros.map(function(x){return '<div class="chip timed" data-fit>＋ '+esc(x)+'</div>'}).join('')+cons.map(function(x){return '<div class="chip timed" data-fit>－ '+esc(x)+'</div>'}).join('')+(item.score!==null&&item.score!==undefined?'<div class="score timed">★ '+esc(item.score)+'</div>':'')+'</div></div>')}
      function flow(scene){var m=model(scene),steps=arr(m.steps),kind=m.kind||'process';return wrap(scene,'<div class="diagram flow '+esc(kind)+'">'+steps.slice(0,6).map(function(step,i){var checks=arr(step.checks||step.acceptance);return (i?'<div class="flow-arrow timed">→</div>':'')+'<div class="flow-step timed '+(m.current===i+1?'active':'')+'"><small>'+String(i+1).padStart(2,'0')+(step.estimate?' · '+esc(step.estimate):'')+'</small><b data-fit>'+esc(step.operation||step.label||'')+'</b>'+(step.input?'<small>输入：'+esc(step.input)+'</small>':'')+(step.output?'<small>输出：'+esc(step.output)+'</small>':'')+(step.check?'<small>检查：'+esc(step.check)+'</small>':'')+(step.caution?'<small>注意：'+esc(step.caution)+'</small>':'')+(checks.length?'<div class="checks">'+checks.map(function(x){return '<span>'+esc(x)+'</span>'}).join('')+'</div>':'')+'</div>'}).join('')+'</div>')}
      function comparison(scene){var m=model(scene);if(m.kind==='before-after'||m.kind==='tradeoff'||m.kind==='decision-tree'){var subjects=m.subjects||['BEFORE','AFTER'],points=arr(m.points),dims0=arr(m.dimensions),half=Math.ceil(points.length/2),left=points.length?points.slice(0,half):dims0.map(function(d){return d.name+': '+d.a}),right=points.length?points.slice(half):dims0.map(function(d){return d.name+': '+d.b});return wrap(scene,'<div class="diagram before-after"><div class="side-card timed"><h2>'+esc(subjects[0])+'</h2>'+left.map(function(x){return '<div class="chip">'+esc(x)+'</div>'}).join('')+'</div><div class="big-arrow timed">→</div><div class="side-card timed"><h2>'+esc(subjects[1])+'</h2>'+right.map(function(x){return '<div class="chip">'+esc(x)+'</div>'}).join('')+'</div></div>')}var subjects=m.subjects||['对象 A','对象 B'],dims=arr(m.dimensions);var rows=dims.length?dims.map(function(d){return '<div class="compare-row timed"><strong>'+esc(d.name)+'</strong><span>'+esc(d.a)+'</span><span>'+esc(d.b)+'</span></div>'}).join(''):'<div class="chart-empty timed">请提供两个对象和统一对比维度</div>';return wrap(scene,'<div class="diagram compare"><div class="compare-head"><span></span><b>'+esc(subjects[0])+'</b><b>'+esc(subjects[1])+'</b></div><div>'+rows+'</div>'+(m.verdict?'<div class="verdict timed" data-fit>'+esc(m.verdict)+'</div>':'')+'</div>')}
      function radar(scene){var m=model(scene),dims=arr(m.dimensions),subjects=m.subjects||['对象 A','对象 B'];if(dims.length<3)return comparison(scene);function point(index,value,max){var angle=-Math.PI/2+Math.PI*2*index/dims.length,r=36*Math.max(0,Math.min(1,Number(value)/(Number(max)||1)));return[50+Math.cos(angle)*r,50+Math.sin(angle)*r]}var axes=dims.map(function(d,i){var p=point(i,1,1);return '<line class="radar-axis" x1="50" y1="50" x2="'+p[0]+'" y2="'+p[1]+'"></line>'}).join(''),a=dims.map(function(d,i){return point(i,d.a,d.max||Math.max(Number(d.a)||0,Number(d.b)||0)).join(',')}).join(' '),b=dims.map(function(d,i){return point(i,d.b,d.max||Math.max(Number(d.a)||0,Number(d.b)||0)).join(',')}).join(' ');return wrap(scene,'<div class="diagram radar"><svg viewBox="0 0 100 100">'+axes+'<polygon class="radar-a timed" points="'+a+'"></polygon><polygon class="radar-b timed" points="'+b+'"></polygon></svg><div class="radar-legend"><span style="color:var(--accent)">● '+esc(subjects[0])+'</span><span style="color:var(--accent2)">● '+esc(subjects[1])+'</span>'+dims.map(function(d){return '<small>'+esc(d.name)+'</small>'}).join('')+'</div></div>')}
      function promo(scene){var m=model(scene),points=arr(m.points),proof=arr(m.proof);return wrap(scene,'<div class="promo"><div class="panel promo-copy"><h2 class="timed" data-fit>'+esc(scene.title)+'</h2>'+points.slice(0,4).map(function(x){return '<p class="timed" data-fit>'+esc(x)+'</p>'}).join('')+proof.map(function(x){return '<div class="proof timed">'+esc(x.text||x)+'</div>'}).join('')+(m.cta?'<div class="cta timed">'+esc(m.cta)+'</div>':'')+'</div><div class="panel promo-visual timed">'+esc(({pain:'!',solution:'✓','feature-demo':'▶',proof:'★',cta:'→'})[m.kind]||'◆')+'</div></div>')}
      function chart(scene){var m=model(scene),values=arr(m.values).map(Number),labelsList=arr(m.labels);if(m.illustrative||!values.length){return wrap(scene,'<div class="chart-empty timed">'+esc(m.label||'趋势示意（非真实数据）')+'</div>')}var transform=m.scale==='log'?function(v){return Math.log(Math.max(v,Number.EPSILON))}:function(v){return v},transformed=values.map(transform),domain=arr(m.domain).length===2?m.domain.map(transform):null,min=domain?domain[0]:Math.min.apply(null,transformed),max=domain?domain[1]:Math.max.apply(null,transformed),span=max-min||Math.abs(max)||1,annotation=arr(m.annotations).map(function(x){return esc(x.label||x.text||x)}).join(' · ');var meta='<div class="chart-meta"><span>'+esc(m.range||'')+(m.scale==='log'?' · LOG':'')+(annotation?' · '+annotation:'')+'</span><span>来源：'+esc(m.source||m.sourceId||'')+'</span></div>';if(m.kind==='ranking-chart'){return wrap(scene,'<div class="panel chart-wrap"><div class="ranking-bars">'+values.map(function(v,i){var width=Math.max(3,100*((transform(v)-min)/span));return '<div class="ranking-row timed"><span data-fit>'+esc(labelsList[i])+'</span><div class="ranking-track"><div class="ranking-fill" style="width:'+width+'%"></div></div><b>'+esc(v)+esc(m.unit)+'</b></div>'}).join('')+'</div>'+meta+'</div>')}if(m.kind==='line-chart'||m.kind==='area-chart'){var pts=values.map(function(v,i){var x=8+(84*(i/Math.max(1,values.length-1))),y=88-76*((transform(v)-min)/span);return [x,y]}),points=pts.map(function(p){return p.join(',')}).join(' '),area='8,92 '+points+' 92,92';var shape=m.kind==='area-chart'?'<polygon class="trend-area timed" points="'+area+'"></polygon>':'<polyline class="trend-line timed" points="'+points+'"></polyline>';return wrap(scene,'<div class="panel chart-wrap"><svg class="trend-svg" viewBox="0 0 100 100" preserveAspectRatio="none"><line class="axis" x1="7" y1="92" x2="94" y2="92"></line><line class="axis" x1="7" y1="8" x2="7" y2="92"></line>'+shape+pts.map(function(p,i){return '<circle class="dot ti       function layout(scene,index){var kind=model(scene).kind||scene.layout;if(kind==='hero')return hero(scene,index);if(kind==='summary')return summary(scene);if(['definition','mechanism','cause-effect','timeline','structure','analogy','misconception','cycle'].includes(kind))return nodeMap(scene);if(['list-overview','list-item','ranking','recommendation'].includes(kind))return listItem(scene);if(['process','decision','checkpoint','demo','acceptance'].includes(kind))return flow(scene);if(kind==='radar')return radar(scene);if(['comparison-table','before-after','tradeoff','decision-tree'].includes(kind))return comparison(scene);if(['pain','solution','feature-demo','proof','cta'].includes(kind))return promo(scene);if(['bar-chart','line-chart','area-chart','ranking-chart','trend-illustration'].includes(kind))return chart(scene);return summary(scene)}
      function fitText(el){var min=el.classList.contains('title')?30:16,guard=80,size=parseFloat(getComputedStyle(el).fontSize);while(guard--&&size>min&&(el.scrollWidth>el.clientWidth+1||el.scrollHeight>el.clientHeight+1)){size-=1;el.style.fontSize=size+'px'}}
      function fitAll(){Array.from(root.querySelectorAll('[data-fit],.title')).forEach(fitText)}
      function semanticTimes(scene,count){var cues=scene.voice.cues||[],start=scene.voice.start,end=scene.voice.start+scene.voice.duration-.18,out=[];for(var i=0;i<count;i++){var cue=cues[Math.min(i,cues.length-1)]||{at:0};var proposed=start+cue.at+.12;out.push(Math.min(end,Math.max(scene.start+.16,proposed)))}return out}
      STORY.scenes.forEach(function(scene,index){var section=document.createElement('section');section.id=scene.id;section.className='scene layout-'+scene.layout;var captions=scene.voice.cues.map(function(cue,cueIndex){return '<span id="'+scene.id+'-caption-'+cueIndex+'">'+esc(cue.text)+'</span>'}).join('');section.innerHTML='<div class="texture"></div><div class="shell"><div class="topline"><div class="eyebrow headline">'+esc(scene.eyebrow)+'</div><div class="topline-right">'+brandMark()+'<div class="chapter headline">'+esc(scene.chapter)+'</div></div></div><h1 class="title headline" data-fit>'+esc(scene.title)+'</h1><div class="title-rule headline"></div><div class="stage">'+layout(scene,index)+'</div><div class="caption">'+captions+'</div></div>';root.appendChild(section)});
      var progress=document.createElement('div');progress.className='progress';progress.innerHTML='<i></i>';root.appendChild(progress);var tl=gsap.timeline({paused:true});
      STORY.scenes.forEach(function(scene,index){var el=document.getElementById(scene.id),entry=scene.start+.05,previous=index?document.getElementById(STORY.scenes[index-1].id):null;if(index===0)tl.set(el,{opacity:1,x:0,y:0},0);else{tl.set(previous,{opacity:0,x:0,y:0},scene.start);tl.set(el,{opacity:1,x:STORY.project.format==='portrait'?0:STORY.render.width*.035,y:STORY.project.format==='portrait'?STORY.render.height*.018:0},scene.start);tl.to(el,{x:0,y:0,duration:.26,ease:'power3.out'},scene.start)}var headlines=el.querySelectorAll('.headline');tl.from(headlines,{y:18,duration:.42,stagger:.06,ease:'power3.out'},entry);var timed=Array.from(el.querySelectorAll('.timed')),times=semanticTimes(scene,timed.length),voiceEnd=scene.voice.start+scene.voice.duration;timed.forEach(function(item,itemIndex){var at=times[itemIndex],duration=Math.max(.12,Math.min(.5,voiceEnd-at-.08));tl.from(item,{y:24,scale:.94,opacity:0,duration:duration,ease:'back.out(1.04)'},at)});scene.voice.cues.forEach(function(cue,cueIndex){var cap=document.getElementById(scene.id+'-caption-'+cueIndex),start=scene.voice.start+cue.at,next=scene.voice.cues[cueIndex+1],end=scene.voice.start+(next?next.at:scene.voice.duration),exit=Math.max(start,end-.1);tl.set(cap,{opacity:1,y:0},start);tl.to(cap,{opacity:0,y:-5,duration:Math.max(.01,end-exit),ease:'power2.in'},exit);tl.set(cap,{opacity:0,y:0},end)})});tl.to('.progress i',{width:'100%',duration:STORY.duration,ease:'none'},0);
      function syncVideos(seconds){Array.from(root.querySelectorAll('video')).forEach(function(video){var scene=video.closest('.scene'),data=STORY.scenes.find(function(x){return x.id===scene.id});if(!data)return;var local=Math.max(0,Math.min(video.duration||0,seconds-data.start));if(Number.isFinite(local)&&Math.abs(video.currentTime-local)>.04)video.currentTime=local})}
      function rgb(value){var probe=document.createElement('span');probe.style.color=value;document.body.appendChild(probe);var parts=getComputedStyle(probe).color.match(/\d+(?:\.\d+)?/g).slice(0,3).map(Number);probe.remove();return parts}function luminance(color){return color.map(function(value){value/=255;return value<=.03928?value/12.92:Math.pow((value+.055)/1.055,2.4)}).reduce(function(sum,value,index){return sum+value*[.2126,.7152,.0722][index]},0)}
      window.__videoDiagnostics=function(){var overflows=[],safeViolations=[],missingMedia=[],layoutIssues=[],hiddenTimed=0;Array.from(root.querySelectorAll('[data-fit],.title')).forEach(function(el){if(el.scrollWidth>el.clientWidth+2||el.scrollHeight>el.clientHeight+2)overflows.push((el.textContent||'').trim())});Array.from(root.querySelectorAll('.media-check img,.media-check video')).forEach(function(el){if((el.tagName==='IMG'&&!el.complete)||(el.tagName==='IMG'&&el.naturalWidth===0)||(el.tagName==='VIDEO'&&el.readyState===0))missingMedia.push(el.getAttribute('src'))});var visible=Array.from(root.querySelectorAll('.scene')).find(function(el){return parseFloat(getComputedStyle(el).opacity)>.5});if(visible){var shell=visible.querySelector('.shell').getBoundingClientRect();hiddenTimed=Array.from(visible.querySelectorAll('.timed')).filter(function(el){return parseFloat(getComputedStyle(el).opacity)<.85}).length;Array.from(visible.querySelectorAll('.title,.stage,.caption')).forEach(function(el){var box=el.getBoundingClientRect();if(box.left<shell.left-2||box.right>shell.right+2||box.top<shell.top-2||box.bottom>shell.bottom+2)safeViolations.push(el.className)});Array.from(visible.querySelectorAll('.visual-grid.no-asset')).forEach(function(grid){var box=grid.getBoundingClientRect(),content=grid.querySelector('.visual-content').getBoundingClientRect();if(content.width<box.width*.88||content.height<box.height*.88)layoutIssues.push('unused no-asset grid area')})}var style=getComputedStyle(root),l1=luminance(rgb(style.getPropertyValue('--ink'))),l2=luminance(rgb(style.getPropertyValue('--bg'))),contrast=(Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05);return{overflows:overflows,safeViolations:safeViolations,missingMedia:missingMedia,layoutIssues:layoutIssues,hiddenTimed:hiddenTimed,contrast:Number(contrast.toFixed(2))}};
