<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <script src="./assets/gsap.min.js"></script>
    <script src="./story.js"></script>
    <style>
      @font-face{font-family:"System Sans";src:local("PingFang SC")}@font-face{font-family:"System Sans";src:local("Microsoft YaHei")}@font-face{font-family:"Mono";src:local("IBM Plex Mono")}
      *{box-sizing:border-box}html,body{margin:0;overflow:hidden}body{font-family:"System Sans","Noto Sans CJK SC",Arial,sans-serif;background:#f5f2ea}.clip{position:relative;overflow:hidden;background:var(--bg);color:var(--ink);--bg:#f5f2ea;--paper:#fffdf7;--ink:#191919;--muted:#6e675d;--accent:#ef5a38;--accent2:#2f66d0;--soft:#f3d9b3}
      .theme-whiteboard{--bg:#f7f2e8;--paper:#fffaf0;--ink:#27251f;--muted:#716b60;--accent:#e8a34a;--accent2:#2f66d0;--soft:#f4d7aa}.theme-tech{--bg:#071425;--paper:#10243c;--ink:#eef5ff;--muted:#9cb2cb;--accent:#4c8dff;--accent2:#ff9d45;--soft:#183453}.theme-product{--bg:#eef2ff;--paper:#ffffff;--ink:#15182b;--muted:#656b82;--accent:#635bff;--accent2:#ff6b45;--soft:#dce3ff}
      .texture{position:absolute;inset:0;pointer-events:none;opacity:.24;background-image:radial-gradient(circle at 20% 12%,color-mix(in srgb,var(--accent) 14%,transparent) 0 1px,transparent 2px),repeating-linear-gradient(4deg,color-mix(in srgb,var(--ink) 4%,transparent) 0 1px,transparent 1px 13px);background-size:23px 23px,auto}.scene{position:absolute;inset:0;overflow:hidden;opacity:0}.shell{position:absolute;inset:0;padding:5.2% 5.5% 10%}.topline{display:flex;align-items:center;justify-content:space-between}.eyebrow{color:var(--muted);font:800 20px/1 Mono,monospace;letter-spacing:.12em}.chapter{padding:10px 18px;border:3px solid var(--ink);border-radius:999px;background:var(--soft);font-size:20px;font-weight:900}.title{position:relative;z-index:4;margin:4.2% 0 0;max-width:76%;font-size:68px;line-height:1.04;letter-spacing:-.055em}.title:after{content:"";display:block;width:42%;height:12px;margin-top:14px;border-bottom:7px solid var(--accent);border-radius:50%;transform:rotate(-1deg)}.stage{position:absolute;left:5.5%;right:5.5%;top:29%;bottom:12%;display:grid;align-items:stretch}.panel{position:relative;border:4px solid var(--ink);border-radius:28px;background:var(--paper);box-shadow:12px 14px 0 color-mix(in srgb,var(--ink) 12%,transparent);overflow:hidden}.layout-hero .stage{grid-template-columns:1.1fr .9fr;gap:4%}.hero-mark{display:grid;place-items:center;min-height:100%;border-radius:38px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;font-size:164px;font-weight:1000;letter-spacing:-.08em}.hero-copy{display:flex;flex-direction:column;justify-content:center;gap:18px;padding:8%}.hero-chip,.tag{display:inline-flex;width:max-content;max-width:100%;padding:13px 20px;border:3px solid var(--ink);border-radius:999px;background:var(--soft);font-size:26px;font-weight:900}.hero-copy strong{font-size:42px;line-height:1.15}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;height:100%}.card{display:flex;min-height:0;flex-direction:column;justify-content:center;padding:34px;border:4px solid var(--ink);border-radius:26px;background:var(--paper);box-shadow:9px 10px 0 color-mix(in srgb,var(--ink) 10%,transparent)}.card:nth-child(2n){background:var(--soft)}.card small{color:var(--accent2);font:900 21px Mono,monospace}.card b{margin-top:14px;font-size:34px;line-height:1.2}.steps{display:flex;align-items:center;gap:18px;height:100%}.step{position:relative;display:flex;min-width:0;flex:1;align-items:center;justify-content:center;height:58%;padding:28px;border:4px solid var(--ink);border-radius:26px;background:var(--paper);text-align:center;font-size:31px;font-weight:900}.step:before{content:attr(data-number);position:absolute;left:18px;top:16px;color:var(--accent2);font:900 21px Mono,monospace}.step-arrow{color:var(--accent);font-size:58px;font-weight:1000}.split{display:grid;grid-template-columns:1fr 1fr;gap:28px;height:100%}.split-side{display:flex;flex-direction:column;justify-content:center;padding:48px;border:4px solid var(--ink);border-radius:30px;background:var(--paper)}.split-side:last-child{background:var(--soft)}.split-label{margin-bottom:24px;color:var(--accent2);font:900 24px Mono,monospace}.split-side b{font-size:38px;line-height:1.2}.chart{display:flex;align-items:flex-end;gap:28px;height:100%;padding:6% 5% 5%;border:4px solid var(--ink);border-radius:30px;background:var(--paper)}.bar{position:relative;display:flex;flex:1;align-items:flex-end;justify-content:center;min-height:26%;padding:20px 12px;border:4px solid var(--ink);border-radius:22px 22px 8px 8px;background:linear-gradient(180deg,var(--accent),var(--accent2));color:white;text-align:center;font-size:25px;font-weight:900}.bar small{position:absolute;top:-38px;color:var(--ink);font:900 20px Mono,monospace}.showcase{display:grid;grid-template-columns:1fr 1fr;gap:30px;height:100%}.showcase-visual{position:relative;display:grid;place-items:center;border:4px solid var(--ink);border-radius:32px;background:linear-gradient(145deg,var(--accent2),var(--accent));overflow:hidden}.showcase-visual img{width:100%;height:100%;object-fit:contain}.product-shape{width:48%;aspect-ratio:1;border:5px solid white;border-radius:28% 35% 24% 39%;background:color-mix(in srgb,white 20%,transparent);box-shadow:45px 30px 0 color-mix(in srgb,white 18%,transparent),-38px -28px 0 color-mix(in srgb,white 12%,transparent);transform:rotate(12deg)}.showcase-copy{display:flex;flex-direction:column;justify-content:center;gap:20px}.concept{display:grid;place-items:center;height:100%}.concept-core{display:grid;place-items:center;width:34%;aspect-ratio:1;border:5px solid var(--ink);border-radius:50%;background:var(--accent);color:white;text-align:center;font-size:34px;font-weight:1000}.concept-tag{position:absolute}.concept-tag:nth-child(2){left:7%;top:12%}.concept-tag:nth-child(3){right:7%;top:16%}.concept-tag:nth-child(4){left:12%;bottom:12%}.concept-tag:nth-child(5){right:10%;bottom:13%}.summary{display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:24px;height:100%;padding:6%;border:4px solid var(--ink);border-radius:32px;background:var(--paper)}.summary .tag{font-size:32px}.caption{position:absolute;z-index:30;left:8%;right:8%;bottom:3.4%;display:grid;min-height:70px;align-items:end;justify-items:center;pointer-events:none}.caption span{display:block;grid-area:1/1;width:max-content;max-width:100%;padding:12px 28px 14px;border-radius:14px;background:color-mix(in srgb,var(--ink) 94%,transparent);color:var(--bg);box-shadow:6px 7px 0 var(--accent);text-align:center;font-size:32px;font-weight:900;line-height:1.28;opacity:0}.progress{position:absolute;z-index:40;left:0;bottom:0;width:100%;height:9px;background:color-mix(in srgb,var(--ink) 12%,transparent)}.progress i{display:block;width:0;height:100%;background:var(--accent)}
      .portrait .shell{padding:8% 7% 13%}.portrait .eyebrow{font-size:19px}.portrait .chapter{font-size:18px}.portrait .title{margin-top:9%;max-width:100%;font-size:70px;line-height:1.08}.portrait .stage{left:7%;right:7%;top:25%;bottom:12%}.portrait .layout-summary .stage{top:38%;bottom:18%}.portrait .layout-hero .stage{grid-template-columns:1fr;grid-template-rows:.9fr 1.1fr}.portrait .hero-mark{font-size:150px}.portrait .hero-copy{padding:8%}.portrait .cards{grid-template-columns:1fr;grid-template-rows:none;grid-auto-rows:minmax(0,1fr);gap:18px}.portrait .card{padding:25px 30px}.portrait .card b{font-size:32px}.portrait .steps{flex-direction:column;gap:14px}.portrait .step{width:100%;height:auto;flex:1;font-size:31px}.portrait .step-arrow{transform:rotate(90deg);font-size:44px}.portrait .split{grid-template-columns:1fr;grid-template-rows:1fr 1fr}.portrait .split-side{padding:38px}.portrait .chart{gap:16px;padding:9% 4% 6%}.portrait .bar{padding:16px 7px;font-size:22px}.portrait .showcase{grid-template-columns:1fr;grid-template-rows:1.1fr .9fr}.portrait .showcase-copy{display:grid;grid-template-columns:1fr 1fr;align-content:center}.portrait .concept-core{width:54%;font-size:32px}.portrait .summary{align-content:center}.portrait .summary .tag{font-size:30px}.portrait .caption{left:6%;right:6%;bottom:3.2%}.portrait .caption span{width:100%;max-width:100%;font-size:38px;padding:16px 24px 18px;overflow-wrap:anywhere}.social .shell{padding-bottom:13%}.social .title{font-size:62px}.social .stage{top:28%;bottom:14%}.social .caption{bottom:4%}.social .caption span{width:100%;max-width:100%;font-size:31px}
    </style>
  </head>
  <body>
    <div id="root" class="clip" data-duration="60" data-width="1920" data-height="1080"></div>
    <script>
      var STORY=window.VIDEO_WORKFLOW_STORY;var root=document.getElementById('root');
      root.style.width=STORY.render.width+'px';root.style.height=STORY.render.height+'px';document.documentElement.style.width=STORY.render.width+'px';document.documentElement.style.height=STORY.render.height+'px';document.body.style.width=STORY.render.width+'px';document.body.style.height=STORY.render.height+'px';root.classList.add('theme-'+STORY.project.theme,STORY.project.format);
      function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
      function items(scene){var values=(scene.visual&&scene.visual.cards||[]).filter(Boolean).slice(0,4);return values.length?values:[scene.title]}
      function cards(scene){return '<div class="cards">'+items(scene).map(function(text,i){return '<div class="card timed" data-item="'+i+'"><small>'+String(i+1).padStart(2,'0')+'</small><b>'+esc(text)+'</b></div>'}).join('')+'</div>'}
      function steps(scene){return '<div class="steps">'+items(scene).slice(0,4).map(function(text,i){return (i?'<div class="step-arrow timed">→</div>':'')+'<div class="step timed" data-number="'+String(i+1).padStart(2,'0')+'">'+esc(text)+'</div>'}).join('')+'</div>'}
      function split(scene){var values=items(scene),mid=Math.max(1,Math.ceil(values.length/2)),groups=[values.slice(0,mid),values.slice(mid)];if(!groups[1].length)groups[1]=['另一种选择'];return '<div class="split">'+groups.map(function(group,i){return '<div class="split-side timed"><div class="split-label">'+(i?'OPTION B':'OPTION A')+'</div><b>'+group.map(esc).join('<br><br>')+'</b></div>'}).join('')+'</div>'}
      function chart(scene){return '<div class="chart">'+items(scene).map(function(text,i){return '<div class="bar timed" style="height:'+(34+(i*19)%58)+'%"><small>'+String(i+1).padStart(2,'0')+'</small>'+esc(text)+'</div>'}).join('')+'</div>'}
      function showcase(scene){var asset=scene.visual&&scene.visual.asset;return '<div class="showcase"><div class="showcase-visual timed">'+(asset?'<img src="'+esc(asset)+'" alt="Scene visual" onerror="this.replaceWith(Object.assign(document.createElement(\'div\'),{className:\'product-shape\'}))">':'<div class="product-shape"></div>')+'</div><div class="showcase-copy">'+items(scene).map(function(text){return '<div class="hero-chip timed">'+esc(text)+'</div>'}).join('')+'</div></div>'}
      function concept(scene){return '<div class="concept"><div class="concept-core timed">'+esc(scene.title)+'</div>'+items(scene).slice(0,4).map(function(text){return '<div class="concept-tag hero-chip timed">'+esc(text)+'</div>'}).join('')+'</div>'}
      function summary(scene){return '<div class="summary">'+items(scene).map(function(text){return '<div class="tag timed">'+esc(text)+'</div>'}).join('')+'</div>'}
      function hero(scene,index){return '<div class="hero-mark timed">'+String(index+1).padStart(2,'0')+'</div><div class="panel hero-copy">'+items(scene).map(function(text,i){return i?'<div class="hero-chip timed">'+esc(text)+'</div>':'<strong class="timed">'+esc(text)+'</strong>'}).join('')+'</div>'}
      function layout(scene,index){if(scene.layout==='hero')return hero(scene,index);if(scene.layout==='cards')return cards(scene);if(scene.layout==='steps')return steps(scene);if(scene.layout==='split')return split(scene);if(scene.layout==='chart')return chart(scene);if(scene.layout==='showcase')return showcase(scene);if(scene.layout==='summary')return summary(scene);return concept(scene)}
      function semanticTimes(scene,count){var cues=scene.voice.cues||[],out=[];for(var i=0;i<count;i++){var cue=cues[Math.min(i,cues.length-1)]||{at:0};var proposed=scene.voice.start+cue.at+.18;out.push(Math.min(scene.voice.start+scene.voice.duration-.18,Math.max(scene.start+.18,proposed)))}return out}
      STORY.scenes.forEach(function(scene,index){var section=document.createElement('section');section.id=scene.id;section.className='scene layout-'+scene.layout;var captions=scene.voice.cues.map(function(cue,cueIndex){return '<span id="'+scene.id+'-caption-'+cueIndex+'">'+esc(cue.text)+'</span>'}).join('');section.innerHTML='<div class="texture"></div><div class="shell"><div class="topline"><div class="eyebrow headline">'+esc(scene.eyebrow)+'</div><div class="chapter headline">'+esc(scene.chapter)+'</div></div><h1 class="title headline">'+esc(scene.title)+'</h1><div class="stage">'+layout(scene,index)+'</div><div class="caption">'+captions+'</div></div>';root.appendChild(section)});
      var progress=document.createElement('div');progress.className='progress';progress.innerHTML='<i></i>';root.appendChild(progress);var tl=gsap.timeline({paused:true});
      STORY.scenes.forEach(function(scene,index){var el=document.getElementById(scene.id),entry=scene.start+.08,previous=index?document.getElementById(STORY.scenes[index-1].id):null;if(index===0)tl.set(el,{opacity:1,x:0,y:0},0);else{tl.set(previous,{opacity:0,x:0,y:0},scene.start);tl.set(el,{opacity:1,x:STORY.project.format==='portrait'?0:STORY.render.width*.05,y:STORY.project.format==='portrait'?STORY.render.height*.025:0},scene.start);tl.to(el,{x:0,y:0,duration:.3,ease:'power3.out'},scene.start)}var headlines=el.querySelectorAll('.headline');tl.from(headlines,{y:22,scale:.98,duration:.55,stagger:.09,ease:'power3.out'},entry);var timed=Array.from(el.querySelectorAll('.timed')),times=semanticTimes(scene,timed.length);timed.forEach(function(item,itemIndex){tl.from(item,{y:28,scale:.9,rotation:itemIndex%2?-1.2:1.2,duration:.58,ease:'back.out(1.08)'},times[itemIndex])});scene.voice.cues.forEach(function(cue,cueIndex){var cap=document.getElementById(scene.id+'-caption-'+cueIndex),start=scene.voice.start+cue.at,next=scene.voice.cues[cueIndex+1],end=scene.voice.start+(next?next.at:scene.voice.duration),exit=Math.max(start,end-.1);tl.set(cap,{opacity:1,y:0},start);tl.to(cap,{opacity:0,y:-5,duration:end-exit,ease:'power2.in'},exit);tl.set(cap,{opacity:0,y:0},end)})});
      tl.to('.progress i',{width:'100%',duration:STORY.duration,ease:'none'},0);tl.seek(0);window.__VIDEO_READY=true;window.__seekVideo=async function(seconds){tl.seek(Math.max(0,Math.min(STORY.duration,seconds)),false);await document.fonts.ready;await new Promise(function(resolve){requestAnimationFrame(function(){requestAnimationFrame(resolve)})});return true};
    </script>
  </body>
</html>
